name: Build Android Release

on:
  # Trigger on push to main or release branches
  push:
    branches:
      - main
      - 'release/**'
    tags:
      - 'v*.*.*'

  # Run analyzer and tests on pull requests (no release build)
  pull_request:

  # Allow manual trigger from Actions tab
  workflow_dispatch:

env:
  # Keep in sync with the version used for local development
  FLUTTER_VERSION: '3.47.8'

jobs:
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      # Database tests run against the system SQLite through sqflite_common_ffi
      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      # app_config.dart is gitignored; generate it from the example
      - name: Create app config
        run: cp lib/core/constants/app_config.dart.example lib/core/constants/app_config.dart

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Run Flutter analyzer
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test --no-pub

  build-android:
    name: Build Android AAB & APK
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Creating the GitHub release on a tag needs write access; the repo's
    # default token is read-only.
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      # Release builds need the real OAuth client ID for Google Drive backup
      - name: Create app config
        env:
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          cp lib/core/constants/app_config.dart.example lib/core/constants/app_config.dart
          if [ -z "$GOOGLE_SERVER_CLIENT_ID" ]; then
            echo "::warning::GOOGLE_SERVER_CLIENT_ID secret is not set; Google Drive backup will not work in this build"
          else
            sed -i "s|YOUR_GOOGLE_SERVER_CLIENT_ID_HERE|$GOOGLE_SERVER_CLIENT_ID|" lib/core/constants/app_config.dart
          fi

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks

      - name: Create key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > android/key.properties << EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=keystore.jks
          EOF

      # Every build records its commit; only a release tag gets a plain
      # version name, so dev builds read e.g. "1.2.0-91a91f9" in Android too.
      - name: Version this build
        run: |
          SHA=${GITHUB_SHA::7}
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ' | cut -d+ -f1)
          FLAGS="--dart-define=GIT_SHA=$SHA"
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then FLAGS="$FLAGS --build-name=$VERSION-$SHA"; fi
          echo "BUILD_FLAGS=$FLAGS" >> $GITHUB_ENV
          echo "Build flags: $FLAGS"

      # GitHub's release servers sometimes refuse the Gradle download (504);
      # retry when that is why the build failed, not for real build errors.
      - name: Build Android App Bundle (AAB)
        run: |
          for i in 1 2 3; do
            if flutter build appbundle --release $BUILD_FLAGS 2>&1 | tee build.log; then exit 0; fi
            grep -q "gradle-distributions" build.log || exit 1
            echo "Gradle download failed (try $i), retrying in 60s"
            sleep 60
          done
          exit 1

      - name: Build Android APK
        run: flutter build apk --release $BUILD_FLAGS

      - name: Get version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ steps.version.outputs.version }}.aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ steps.version.outputs.version }}.apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build summary
        run: |
          echo "## Build Successful! 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Version: ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Android App Bundle (AAB) - Ready for Play Store" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Android APK - Ready for testing" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### File Sizes:" >> $GITHUB_STEP_SUMMARY
          ls -lh build/app/outputs/bundle/release/app-release.aab | awk '{print "- AAB: " $5}' >> $GITHUB_STEP_SUMMARY
          ls -lh build/app/outputs/flutter-apk/app-release.apk | awk '{print "- APK: " $5}' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps:" >> $GITHUB_STEP_SUMMARY
          echo "1. Download the AAB file from the Artifacts section above" >> $GITHUB_STEP_SUMMARY
          echo "2. Go to Google Play Console" >> $GITHUB_STEP_SUMMARY
          echo "3. Upload the AAB to Production or Testing track" >> $GITHUB_STEP_SUMMARY
